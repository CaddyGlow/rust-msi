[workspace]
members = [".", "ffi"]
default-members = [".", "ffi"]

[workspace.package]
version = "0.10.2"
authors = ["Matthew D. Steele <mdsteele@alum.mit.edu>"]
repository = "https://github.com/CaddyGlow/rust-msi"
keywords = ["msi", "windows", "installer", "package"]
license = "MIT"
readme = "README.md"
edition = "2024"
rust-version = "1.99"

[package]
name = "caddy-msi"
version.workspace = true
authors.workspace = true
description = "Read/write Windows Installer (MSI) files with hardened schema metadata parsing"
repository.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "msi"

[dependencies]
cabinet = { package = "ms-cabinet", version = "0.1.4", default-features = false, optional = true }
byteorder = "1"
cfb = "0.14"
encoding_rs = "0.8"
uuid = "1"

[features]
media = ["dep:cabinet"]

[dev-dependencies]
clap = "2.27"
pest = "2.1"
pest_derive = "2.1"
time = "0.3"
